spring.application.name=adp-forecast
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# SQLite file on the /data volume; override ADP_DATA_DIR when running outside Docker.
spring.datasource.url=jdbc:sqlite:${ADP_DATA_DIR:/data}/adp.db
