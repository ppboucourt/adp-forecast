spring.application.name=adp-forecast
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# SQLite file on the /data volume; override ADP_DATA_DIR when running outside Docker.
spring.datasource.url=jdbc:sqlite:${ADP_DATA_DIR:/data}/adp.db
spring.sql.init.mode=always

# Committed snapshot of every ALFRED vintage (make refresh-snapshot rewrites it).
adp.csv.path=/app/data/adp_vintages.csv
adp.fred.base-url=https://api.stlouisfed.org/fred
adp.fred.series-id=ADPMNUSNERSA
adp.fred.api-key=${FRED_API_KEY:}

# AR lag order, fixed up front.
adp.ar.order=3

# Moving-average model (bean "ma") and rolling fit window (bean "rolling-60"), fixed up front.
adp.ma.window=3
adp.rolling.months=60

# Baseline forecaster that skill is measured against.
adp.baseline=naive
